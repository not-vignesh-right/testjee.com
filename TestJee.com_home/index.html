              subject: 'Chemistry'
            },
            {
              id: 3,
              text: 'If the roots of the equation x² - px + q = 0 differ by 1, then which of the following is true?',
              image: null,
              options: [
                { id: 'A', text: 'p² = 4q + 1' },
                { id: 'B', text: 'p² = 4q - 1' },
                { id: 'C', text: 'p² + 4q = 1' },
                { id: 'D', text: 'p² - 4q = 1' }
              ],
              correct: 'A',
              subject: 'Mathematics'
            },
            {
              id: 4,
              text: 'A uniform rod of length L and mass M is pivoted at its center. A force F is applied at one end perpendicular to the rod. What is the angular acceleration?',
              image: null,
              options: [
                { id: 'A', text: '6F/ML' },
                { id: 'B', text: '12F/ML' },
                { id: 'C', text: 'F/ML' },
                { id: 'D', text: '3F/ML' }
              ],
              correct: 'A',
              subject: 'Physics'
            },
            {
              id: 5,
              text: 'What is the oxidation state of chromium in K₂Cr₂O₇?',
              image: null,
              options: [
                { id: 'A', text: '+4' },
                { id: 'B', text: '+5' },
                { id: 'C', text: '+6' },
                { id: 'D', text: '+7' }
              ],
              correct: 'C',
              subject: 'Chemistry'
            }
          ];
          loading.value = false;
        };

        const startTimer = () => {
          timerInterval.value = setInterval(() => {
            if (timeLeft.value > 0) {
              timeLeft.value--;
            } else {
              submitTest();
            }
          }, 1000);
        };

        const formatTime = (seconds) => {
          const hrs = Math.floor(seconds / 3600);
          const mins = Math.floor((seconds % 3600) / 60);
          const secs = seconds % 60;
          return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        };

        const getTimerClass = () => {
          if (timeLeft.value < 60) return 'text-red-600 font-bold';
          if (timeLeft.value < 300) return 'text-orange-600 font-semibold';
          return 'text-gray-900';
        };

        const goToQuestion = (index) => {
          visited.value[currentIndex.value] = true;
          currentIndex.value = index;
          visited.value[index] = true;
        };

        const saveAndNext = () => {
          visited.value[currentIndex.value] = true;
          if (currentIndex.value < questions.value.length - 1) {
            currentIndex.value++;
            visited.value[currentIndex.value] = true;
          }
        };

        const clearResponse = () => {
          delete responses.value[currentIndex.value];
        };

        const markForReview = () => {
          marked.value[currentIndex.value] = true;
          saveAndNext();
        };

        const selectOption = (optionId) => {
          responses.value[currentIndex.value] = optionId;
        };

        const getQuestionStatus = (index) => {
          const isMarked = marked.value[index];
          const isAnswered = responses.value[index] !== undefined;
          const isVisited = visited.value[index];

          if (isAnswered && isMarked) return 'answered-marked';
          if (isAnswered) return 'answered';
          if (isMarked) return 'marked';
          if (isVisited) return 'not-answered';
          return 'not-visited';
        };

        const getStatusClass = (status) => {
          const styles = {
            'not-visited': 'background-color: #F3F4F6; border-color: #D1D5DB; color: #374151',
            'not-answered': 'background-color: #EF4444; border-color: #EF4444; color: white',
            'answered': 'background-color: #10B981; border-color: #10B981; color: white',
            'marked': 'background-color: #8B5CF6; border-color: #8B5CF6; color: white',
            'answered-marked': 'background-color: #8B5CF6; border-color: #10B981; color: white'
          };
          return styles[status] || styles['not-visited'];
        };

        const calculateScore = () => {
          let totalScore = 0;
          let correct = 0;
          let incorrect = 0;
          let unanswered = 0;

          questions.value.forEach((q, idx) => {
            const answer = responses.value[idx];
            if (answer === undefined) {
              unanswered++;
            } else if (answer === q.correct) {
              totalScore += 4;
              correct++;
            } else {
              totalScore -= 1;
              incorrect++;
            }
          });

          return { totalScore, correct, incorrect, unanswered };
        };

        const submitTest = () => {
          if (timerInterval.value) clearInterval(timerInterval.value);
          const result = calculateScore();
          score.value = result;
          showResults.value = true;
          
          // Initialize performance chart after results are shown
          setTimeout(() => {
            const ctx = document.getElementById('performanceChart');
            if (ctx) {
              new Chart(ctx, {
                type: 'line',
                data: {
                  labels: questions.value.map((_, i) => `Q${i + 1}`),

                    label: 'Performance',
                    data: questions.value.map((q, i) => {
                      const response = responses.value[i];
                      if (response === q.correct) return 100;
                      if (response === undefined) return 0;
                      return -25; // Wrong answer

                    tension: 0.4

                      display: false
                    }

                      max: 100,

                        callback: function(value) {

                        }
                      }
                    }

                }
              });

            return;

          showWelcome.value = false;
          showInstructions.value = true;
          // Enter full-screen when showing instructions
          toggleFullScreen();
        };

        const startExam = () => {
          showInstructions.value = false;
          examStarted.value = true;
          loading.value = false;
          startTimer();
          visited.value[0] = true;
          // Already in full-screen from instructions
        };

        const toggleFullScreen = () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().then(() => {
              isFullScreen.value = true;
            }).catch(err => {
              console.log('Fullscreen request failed:', err);
            });
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen().then(() => {
                isFullScreen.value = false;
              });
            }
          }
        };

        const handleFullscreenChange = () => {
          if (!document.fullscreenElement) {
            // User exited full-screen
            isFullScreen.value = false;
            // If in instructions, go back to welcome
            if (showInstructions.value) {
              showInstructions.value = false;
              showWelcome.value = true;
            }
            // If in exam, auto-submit and show results
            if (examStarted.value) {
              submitTest();
            }
          } else {
            isFullScreen.value = true;
          }
        };

        onMounted(() => {
          loadDemoQuestions();
          // Don't start timer or mark visited - wait for user to start exam
          // Add fullscreen change listener
          document.addEventListener('fullscreenchange', handleFullscreenChange);
        });

        onUnmounted(() => {
          if (timerInterval.value) clearInterval(timerInterval.value);
          document.removeEventListener('fullscreenchange', handleFullscreenChange);
        });

        return {
          questions, loading, error, currentIndex, responses, marked, visited,
          timeLeft, showResults, showUpgrade, score, formatTime, getTimerClass,
          goToQuestion, saveAndNext, clearResponse, markForReview, selectOption,

                  </div>

                  <!-- Question Numbers -->
                  <div class="space-y-4">
                    <div v-for="(subject, idx) in ['Physics', 'Chemistry', 'Mathematics']" :key="subject">
                      <div class="flex items-center justify-between mb-1">
                        <h4 class="font-semibold text-gray-800">{{ subject }}</h4>
                      </div>
                      <div class="grid grid-cols-5 gap-2 palette-grid">
                        <button v-for="(q, index) in questions.filter(qu => qu.subject === subject)" :key="index"
                                @click="goToQuestion(questions.indexOf(q))"
                                :class="['w-10 h-10 rounded-lg border-2 font-medium text-sm transition-all duration-200 hover:scale-105 palette-button',
                                         currentIndex === questions.indexOf(q) ? 'ring-2 ring-offset-2' : '']"
                                :style="[getStatusClass(getQuestionStatus(questions.indexOf(q))),
                                         currentIndex === questions.indexOf(q) ? 'ring-color: #3B82F6;' : ''].join(';')">
                          {{ questions.indexOf(q) + 1 }}
                        </button>
                      </div>
                    </div>
                  </div>

                  <!-- Summary Stats -->
                  <div class="bg-white border border-gray-200 rounded-lg p-4 space-y-3">
                    <h4 class="font-medium text-gray-800 text-sm">Summary:</h4>
                    <div class="grid grid-cols-2 gap-4 text-sm">
                      <div class="text-center">
                        <div class="text-2xl font-bold" style="color: #10B981;">{{ Object.keys(responses).length }}</div>
                        <div class="text-gray-600">Answered</div>
                      </div>
                      <div class="text-center">
                        <div class="text-2xl font-bold" style="color: #8B5CF6;">{{ Object.keys(marked).filter(k => marked[k]).length }}</div>
                        <div class="text-gray-600">Marked</div>
                      </div>
                      <div class="text-center col-span-2">
                        <div class="text-lg font-medium text-gray-800">
                          {{ questions.length - Object.keys(responses).length }} questions remaining
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Current Question Indicator -->
                  <div class="text-white rounded-lg p-3 text-center" style="background-color: #3B82F6;">
                    <div class="text-sm">Currently Viewing</div>
                    <div class="text-lg font-bold">Question {{ currentIndex + 1 }}</div>
                    <div class="text-xs opacity-90">{{ questions[currentIndex]?.subject }}</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `
    };



    const router = createRouter({
      history: createWebHashHistory(),
      routes: [
        { path: '/', component: Home }, { path: '/exams', component: Exams }, { path: '/features', component: Features },
        { path: '/about', component: About }, { path: '/contact', component: Contact },
        { path: '/demo', component: Demo }, { path: '/:catchAll(.*)', redirect: '/' }
      ]
    });

    createApp({
      components: { Header, Footer },
      setup() {
        const route = VueRouter.useRoute();
        const isDemoRoute = Vue.computed(() => route.path === '/demo');
        return { isDemoRoute };
      },
      template: `<div class="min-h-screen flex flex-col"><Header v-if="!isDemoRoute"/><router-view :class="isDemoRoute ? '' : 'flex-1'"/><Footer v-if="!isDemoRoute"/></div>`
    }).use(router).mount('#app');

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(registration => {
            console.log('Service Worker registered successfully:', registration.scope);
          })
          .catch(error => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }

    // Initialize scroll reveal animations
    document.addEventListener('DOMContentLoaded', () => {
      const revealElements = document.querySelectorAll('.reveal');
      if (revealElements.length > 0) {
        const revealObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('show');
            }
          });
        }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

        revealElements.forEach(el => revealObserver.observe(el));
      }
    });
  </script>
</body>

</html>
